<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PupFlow Dog Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* One question per screen, phone first: brand header, progress bar, a single card of choices, sticky Back/Next bar. Single light look (the brand asks for a white page). */
:root{
  color-scheme:light;
  --teal:#1F6F78; --teal-deep:#154E55; --orange:#F28C38; --orange-deep:#D9741F;
  --cream:#FFF6EC; --mint:#EEF6F6; --ink:#22313F; --muted:#5B6B78; --line:#D7E3E4;
  --white:#FFFFFF; --error:#B3261E; --error-bg:#FDECEA;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--white);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;min-height:100%}
.wrap{max-width:620px;margin:0 auto;padding-block:12px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
header.top img{height:34px;width:auto}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;font:600 13px var(--font-body);color:var(--muted);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--teal);color:var(--white)}
.testbar{display:none;font-size:12.5px;color:var(--teal-deep);background:var(--mint);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.progress{height:8px;background:var(--mint);border-radius:999px;overflow:hidden;margin-block:6px 6px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:999px;transition:width .35s ease}
.stepcount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.stepcount b{color:var(--teal);font-weight:700}

.screen{animation:in .3s ease both;padding-top:18px}
@keyframes in{from{opacity:.0001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}
h1,h2{font-family:var(--font-display);text-wrap:balance;color:var(--teal-deep);margin:0}
h1{font-size:clamp(28px,6.5vw,38px);line-height:1.1;font-weight:800}
h2{font-size:clamp(23px,5.4vw,30px);line-height:1.15;font-weight:700}
.lead{color:var(--muted);margin:10px 0 0;max-width:60ch}
.help{color:var(--muted);font-size:14px;margin:8px 0 0}
.q{display:grid;gap:12px;margin-top:18px}
.sub{margin-top:26px}
.sub h3{font:700 17px var(--font-body);margin:0;color:var(--ink)}

input[type=text],input[type=email],input[type=number],textarea{
  width:100%;font:500 18px var(--font-body);color:var(--ink);background:var(--white);
  border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;outline:none;transition:border-color .15s}
textarea{font-size:16px;min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:var(--teal)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}

.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--white);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;
  font:600 16px var(--font-body);color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:#A9C9CC}
.opt:active{transform:scale(.99)}
.opt:focus-visible,.lang button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--white)}
.opt.multi .mark{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--mint)}
.opt[aria-checked="true"] .mark{background:var(--teal);border-color:var(--teal)}
.opt[aria-checked="true"] .mark::after{content:"";width:10px;height:6px;border:solid var(--white);border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt .emoji{font-size:22px;line-height:1}

.bcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.bcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bcs .opt{flex-direction:column;justify-content:flex-start;text-align:center;padding:12px 8px;gap:6px;font-size:14px}
.bcs .opt svg{width:64px;height:76px}
.bcs .opt .mark{position:absolute;top:8px;right:8px;width:18px;height:18px}

.unit{display:flex;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.unit button{border:0;background:var(--white);font:700 15px var(--font-body);padding:0 18px;color:var(--muted);cursor:pointer}
.unit button[aria-pressed="true"]{background:var(--teal);color:var(--white)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--teal);flex:none}

.search{position:relative}
.sugg{list-style:none;margin:6px 0 0;padding:6px;border:2px solid var(--line);border-radius:var(--r);max-height:260px;overflow:auto;background:var(--white)}
.sugg li{padding:10px 12px;border-radius:10px;cursor:pointer}
.sugg li small{color:var(--muted)}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--mint)}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--mint);border:2px solid var(--teal);border-radius:var(--r);padding:12px 16px;font-weight:700}
.picked button{border:0;background:none;color:var(--teal);font:600 14px var(--font-body);cursor:pointer;text-decoration:underline}

.photo{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:var(--r);padding:12px 14px;background:var(--white)}
.photo .ph{flex:none;width:72px;height:72px;border-radius:50%;background:var(--mint) center/cover no-repeat;display:grid;place-items:center;overflow:hidden;border:3px solid var(--white);box-shadow:0 0 0 2px var(--teal)}
.photo .ph img{width:34px;opacity:.55}
.photo .txt{min-width:0;flex:1}
.photo .txt b{display:block;font-size:15.5px}
.photo .txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.photo .acts{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.photo label.pick,.photo button.rm{font:700 14px var(--font-body);color:var(--teal);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo.has{border-style:solid;border-color:var(--teal);background:var(--mint)}
.done-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--white);box-shadow:0 0 0 3px var(--orange);margin:6px auto 4px;display:block}
.err{display:none;color:var(--error);background:var(--error-bg);border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600;margin-top:14px}
.err.on{display:block}
.note{background:var(--cream);border-radius:var(--r);padding:12px 14px;font-size:14.5px}

.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:999px;font:800 17px var(--font-body);padding:15px 22px;cursor:pointer;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1;background:var(--orange);color:var(--white);box-shadow:0 6px 16px rgba(242,140,56,.28)}
.btn.primary:hover{background:var(--orange-deep)}
.btn.ghost{background:var(--white);color:var(--teal);border:2px solid var(--line)}
.btn[disabled]{opacity:.6;cursor:wait}

.hero-dog{display:flex;justify-content:center;margin-block:8px 4px}
.hero-dog img{width:76px;height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.hero-dog img{animation:none}}
.done{text-align:center}
.done .lead{margin-inline:auto}
.summary{text-align:left;margin-top:22px;border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px}
.summary div:first-child{border-top:0}
.summary dt{color:var(--muted);margin:0}
.summary dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.saved{display:inline-block;margin-top:14px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px}
.summary div.rv{grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;align-items:start}
.summary .edit{border:0;background:none;color:var(--teal);font:700 14px var(--font-body);cursor:pointer;text-decoration:underline;padding:0}
.saved.busy{background:#FFF6EC;color:#22313F}
.saved.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid #F28C38;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.saved.ok{background:var(--mint);color:var(--teal-deep)}
.saved.no{background:var(--cream);color:var(--ink)}
pre.raw{white-space:pre-wrap;word-break:break-word;background:var(--mint);border-radius:10px;padding:12px;font-size:12px;max-height:220px;overflow:auto;text-align:left}
</style>

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    const M=1000, k=Math.min(1, M/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.82);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- breed search ---------- */
const bn = b => (lang==="es" && b.e) ? b.e : b.n;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function breedSearch(q){
  q = norm(q.trim()); if(q.length<2) return [];
  const out=[];
  for(const b of BREEDS){
    const n=norm(bn(b)); const al=[b.n,...(b.e?[b.e]:[]),...b.a,...(b.ea||[])].map(norm).filter(x=>x!==n);
    let score = (n===q||al.includes(q))?-1 : n.startsWith(q)?0 : n.includes(q)?1 : al.some(a=>a.startsWith(q))?2 : al.some(a=>a.includes(q))?3 : 99;
    if(score<99) out.push([score,b]);
  }
  return out.sort((x,y)=>x[0]-y[0]||bn(x[1]).localeCompare(bn(y[1]))).slice(0,8).map(x=>x[1]);
}

function payload(){
  const y=+A.age_years||0, m=+A.age_months||0;
  const w=parseFloat(A.weight);
  return {
    plan_lang: lang,
    photo: null,
    submitted_at: new Date().toISOString(),
    owner_first_name: A.owner_first_name.trim(), email: A.email.trim(),
    dog: {
      name: A.dog_name.trim(), sex: A.sex, neutered: A.neutered, pregnant_or_nursing: A.pregnant_or_nursing||null,
      breed: A.breed, breed_slug: A.breed_slug||null,
      age_years: y, age_months: m, age_total_months: y*12+m,
      weight: A.weight_unknown?null:w, weight_unit: A.weight_unit, weight_lb: A.weight_unknown?null:Math.round((A.weight_unit==="kg"?w*2.20462:w)*10)/10, weight_unknown: A.weight_unknown,
      body_condition: A.body_condition,
      food: A.food, food_other: A.food.includes("other")?A.food_other.trim():null, kcal: (A.kcal&&!A.kcal_unknown)?+A.kcal:null, kcal_unit: (A.kcal&&!A.kcal_unknown)?A.kcal_unit:null,
      allergies: A.allergies, allergies_other: A.allergies_other.trim()||null,
      activity: A.activity, housing: A.housing, housing_other: A.housing==="other"?A.housing_other.trim():null, household: A.household, household_other: A.household.includes("other")?A.household_other.trim():null,
      time_per_day_min: +A.time_per_day_min,
      problems: A.problems.filter(p=>p!=="other"), problems_other: A.problems.includes("other")?(A.problems_other.trim()||"(sin detalle)"):null,
      known_cues: A.known_cues, known_cues_other: A.known_cues.includes("other")?A.known_cues_other.trim():null,
    },
    gates: { vet_gate: A.vet_condition==="yes"||A.pregnant_or_nursing==="yes", bite_gate: A.bite_history==="yes" },

    notes: A.notes.trim()||null,

}

  const L=k=>t(k);

  const list=(arr,map)=>arr.map(v=>t(map?map(v):v)).join(", ");
  return [
    [t("q1"), A.dog_name, "name"],
    [t("phSum"), A.photo?("✓"+(A.photo_social?" · "+(lang==="es"?"se puede compartir":"OK to share"):"")):"—", "name"],
    [t("q2"), `${L(A.sex)} · ${L(A.neutered)}${A.pregnant_or_nursing?` · ${t("q2c")} ${L(A.pregnant_or_nursing)}`:""}`, "sex"],
    [t("q3"), A.breed==="mixed"?L("mixed"):A.breed==="unknown"?L("unknown"):A.breed, "breed"],

    [t("q7"), list(A.allergies,v=>v==="other"?"otherA":v)+(A.allergies_other?` (${A.allergies_other})`:""), "allergies"],
    [t("q8"), L(A.activity), "activity"],
    [t("q9"), (A.housing==="other"?(A.housing_other||t("otherA")):L(A.housing))+" · "+list(A.household,v=>v==="other"?"otherA":v)+(A.household.includes("other")&&A.household_other?` (${A.household_other})`:""), "home"],
    [t("q10"), A.time_per_day_min==="60"?t("min60"):t("min",{m:A.time_per_day_min}), "time"],
    [t("q11"), list(A.problems)+(A.problems_other?` (${A.problems_other})`:""), "problems"],
    [t("q12"), list(A.known_cues,v=>v==="name"?"c_name":v==="none"?"c_none":v==="other"?"otherA":v)+(A.known_cues.includes("other")&&A.known_cues_other?` (${A.known_cues_other})`:""), "cues"],

/* ---------- save ---------- */
function getDb(){ return null; }
async function save(p){
  if (!PURCHASE) return false;
  if (A.photo) p.photo = { data: A.photo, share_on_social: A.photo_social };
  try {
    const r = await fetch("/.netlify/functions/submit-plan", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ order: PURCHASE.order, token: PURCHASE.token, purchase_lang: PURCHASE.plan_lang, payload: p }) });
    if (r.ok) { try { localStorage.setItem("pf-sent-" + PURCHASE.order, "1"); } catch (e) {} }
    return r.ok;
  } catch (e) { return false; }
}

/* ---------- flow ---------- */
const $=id=>document.getElementById(id);
function showErr(m){ const e=$("err"); e.textContent=m; e.classList.add("on"); }
function clearErr(){ $("err").classList.remove("on"); }
function render(keepFocus){
  const s=STEPS[step];
  const active=document.activeElement && document.activeElement.id;
  const scr=$("screen"); scr.textContent="";
  const box=el("div",{class:"screen"}, ...s.view()); scr.append(box);
  if(!keepFocus) box.style.animation="none";
  $("testbar").textContent=t("test");
  $("prog").hidden = !!(s.intro||s.done||s.review);
  const qn = STEPS.slice(0,step+1).filter(x=>!x.intro&&!x.done&&!x.review).length;
  $("progbar").style.width = (s.done?100:Math.round((qn-1)/QCOUNT*100))+"%";
  $("stepnum").textContent = t("step",{n:qn,t:QCOUNT});
  $("stepname").textContent = "";
  $("back").hidden = !!(s.intro||s.done);
  $("next").hidden = !!(s.done && saveState!==false);
  $("next").textContent = s.intro? t("start") : s.done? t("finish") : s.review? t("rvGo") : fromReview? t("backRv") : s.id==="owner"? t("toReview") : t("next");
  $("next").disabled=false;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  document.documentElement.lang=lang;
  if(active && $(active) && !/^(next|back|lang-)/.test(active)) { const a=$(active); a.focus(); if(a.setSelectionRange&&a.type==="text"){const n=a.value.length;a.setSelectionRange(n,n);} }
}
function enter(){ render(true); clearErr(); window.scrollTo({top:0}); const s=STEPS[step]; const f=s.focus||(["name"].includes(s.id)?"dog_name":null); if(f&&$(f)&&matchMedia("(pointer:fine)").matches) $(f).focus(); }
async function go(){
  const s=STEPS[step];
  if(s.done){ if(saveState===false){ $("next").disabled=true; saveState=null; render(true); saveState=await save(lastPayload); render(true); } return; }
  if(s.valid){ const m=s.valid(); if(m){ showErr(m); return; } }
  if(fromReview && !s.review){ fromReview=false; step=STEPS.findIndex(x=>x.review); enter(); return; }
  if(s.review){
    $("next").disabled=true; $("next").textContent=t("sending");
    lastPayload=payload(); saveState=null; step++; enter();
    saveState = await save(lastPayload); if(STEPS[step].done) render(true);
    return;
  }
  step++; enter();
}
$("next").addEventListener("click",go);
$("back").addEventListener("click",()=>{ if(fromReview){ go(); return; } if(step>0){ step--; enter(); }});
$("f").addEventListener("submit",e=>{e.preventDefault(); go();});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.tagName==="INPUT" && e.target.id!=="breedq" && e.target.type!=="checkbox"){ e.preventDefault(); go(); }});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.l; try{localStorage.setItem("pf-plan-lang",lang);}catch(e){} render(true); }));
if (!PURCHASE) {
  document.getElementById("f").innerHTML = '<div class="screen" style="text-align:center;padding:40px 0"><h1>' + t("noBuyT") + '</h1><p class="lead">' + t("noBuyL") + '</p><p><a class="btn" href="index.html?lang=' + lang + '">' + t("noBuyB") + '</a></p></div>';
} else enter();
</script>
