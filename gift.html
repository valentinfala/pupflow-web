<style>
:root{--teal:#1F6F78;--deep:#154E55;--orange:#F28C38;--orange-dark:#C9661A;--cream:#FFF6EC;--mint:#EEF6F6;--ink:#22313F;--soft:#5B6B78;--line:#E1ECEC;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.08;margin:0;color:var(--deep);text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:1080px;margin:0 auto}
.top img{height:34px;display:block}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--mint);border:1px solid var(--line);gap:2px}
.lang button{border:0;background:transparent;font:800 13px/1 var(--body);color:var(--soft);min-width:40px;min-height:32px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:#fff}
.test{display:none;background:#FFE7CF;color:#7a3f00;text-align:center;font-size:14px;font-weight:700;padding:8px 16px}.test.on{display:block}
main{max-width:1080px;margin:0 auto;padding:12px 16px 72px;display:grid;gap:28px}
@media(min-width:900px){main{grid-template-columns:.9fr 1.1fr;align-items:start;padding-top:32px;gap:48px}}
.side{position:relative;border-radius:30px;padding:clamp(24px,4vw,40px);color:#fff;overflow:hidden;
  background:radial-gradient(120% 80% at 80% 30%,#1E6871 0%,#14484F 45%,#0E3338 100%);box-shadow:0 40px 80px -50px rgba(14,51,56,.9)}
.side::before{content:"";position:absolute;inset:12px;border:1px solid rgba(226,196,126,.32);border-radius:22px;pointer-events:none}
.eyebrow{font:700 14px/1 var(--body);color:#E2C47E;display:inline-flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,#B98A3A,#F6E3A6)}
.intro h1{font-size:clamp(28px,4vw,40px);margin-bottom:12px;color:#fff}
.intro p{color:#CFE3E3;margin:0 0 26px;max-width:46ch;font-size:16.5px}

/* the card, updated live while the giver types */
.card{position:relative;border-radius:20px;padding:22px 24px 22px;background:linear-gradient(160deg,#FFFDF7 0%,#F5ECD6 100%);color:var(--deep);
  box-shadow:0 34px 60px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.4);transform:rotate(-1.2deg);transition:transform .45s cubic-bezier(.34,1.56,.64,1);overflow:hidden}
.card::before{content:"";position:absolute;inset:8px;border:1px solid #D4AC5C;border-radius:14px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.card.bump{transform:rotate(0) scale(1.012)}.card.bump::after{transition:transform .9s ease;transform:translateX(130%)}
.card .k{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:#A7782C;letter-spacing:.04em}
.seal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#F6E3A6,#B98A3A);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px -8px rgba(120,80,20,.8)}
.seal svg{width:20px;height:20px}
.names{margin:14px 0 4px;display:grid;gap:2px}
.names .to{font:800 clamp(30px,3.6vw,40px)/1.02 var(--display);letter-spacing:-.025em;color:var(--deep);overflow-wrap:anywhere}
.names .from{font:600 17px/1.3 var(--body);color:var(--soft);overflow-wrap:anywhere}
.names small{font:600 14px/1 var(--body);color:#A7782C;margin-right:6px;letter-spacing:0}
.card .msg{margin-top:14px;font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-line;overflow-wrap:anywhere;padding-left:14px;border-left:2px solid #D4AC5C}
.card .msg b{display:block;font-family:var(--display);font-size:19px;color:var(--deep)}
.card .msg[hidden]{display:none}
.card .what{margin-top:16px;padding-top:12px;border-top:1px solid #E8D9B5;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;color:var(--teal)}
.card .what span:last-child{color:#A7782C}
.inc{margin:24px 4px 0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px;color:#EAF4F4;position:relative}
.inc li{display:flex;gap:12px;align-items:baseline}.inc li::before{content:"";flex:none;width:10px;height:10px;transform:rotate(45deg) translateY(-1px);border-radius:2px;background:linear-gradient(135deg,#F6E3A6,#B98A3A)}

/* form */
.panel{border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,28px);background:#fff;box-shadow:0 24px 50px -40px rgba(21,78,85,.5)}
.grp{border:0;margin:0 0 22px;padding:0;min-width:0}
.grp>legend{font:800 19px/1.2 var(--display);color:var(--deep);margin-bottom:12px;padding:0}
.pre{font-weight:800;color:#A7782C;margin-right:4px}
.row{display:grid;gap:12px}@media(min-width:560px){.row.two{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:6px;font-weight:700;font-size:14px}
label.f small{font-weight:500;color:var(--soft)}
input[type=text],input[type=email],textarea{width:100%;font:500 16px/1.4 var(--body);color:var(--ink);border:1.5px solid #CFDDDF;border-radius:14px;padding:13px 14px;background:#fff}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,111,120,.14)}
.bad{border-color:#C6392C!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 14px/1 var(--body);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--mint);border-color:var(--teal);color:var(--deep)}
.count{display:block;text-align:right;font-size:12px;color:var(--soft);margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;font:700 15px/1.2 var(--body);color:var(--ink);cursor:pointer;text-align:left}
.seg button small{display:block;font-weight:500;color:var(--soft);font-size:13px;margin-top:3px}
.seg button[aria-pressed=true]{border-color:var(--teal);background:var(--mint)}
.add{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1.5px dashed #DCC48E;background:#FFFBF0;border-radius:16px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.add[aria-checked=true]{border-style:solid;border-color:#C9A04F;box-shadow:0 10px 24px -18px rgba(150,110,40,.7)}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #C9A04F;display:grid;place-items:center;margin-top:2px;color:#fff;font-weight:900;font-size:15px}
.add[aria-checked=true] .box{background:linear-gradient(135deg,#E9CD86,#B98A3A)}
.add b{display:block;font-size:16px}.add span.d{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.add .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.base{font-size:14px;color:var(--soft);margin:0 0 10px}
.sum{border-top:1px dashed #E3D2BF;margin-top:6px;padding-top:12px;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum div[hidden]{display:none}
.sum .tot{font-weight:800;font-size:19px;color:var(--deep);margin-top:4px}
.sum s{opacity:.55;margin-right:6px}
.promo{justify-self:start;display:inline-block;background:linear-gradient(135deg,#F6E3A6,#C9A04F);color:#3A2A0B;font-weight:800;font-size:12.5px;padding:5px 11px;border-radius:999px}
.promo[hidden]{display:none}
.pp{min-height:110px;margin-top:18px}
.msgbox{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}.msgbox.on{display:block}
.msgbox.err{background:#fde8e8;color:#8a1c1c}.msgbox.ok{background:#e6f6ec;color:#1d5b33}
.safe{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--soft);font-size:14px;margin-top:12px}
.rf{color:var(--soft);font-size:13px;text-align:center;margin:10px 0 0}.rf a{color:var(--teal)}
.spin{width:28px;height:28px;border:3px solid var(--mint);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.done{text-align:center;display:grid;gap:14px;justify-items:center;padding:20px 0}
.done .big{font-size:58px;line-height:1}
.done p{color:var(--soft);max-width:44ch;margin:0}
.done a{color:var(--teal);font-weight:700}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media(max-width:600px){.side{padding:22px 20px 24px;border-radius:24px}.side::before{inset:8px;border-radius:18px}.intro h1{font-size:26px}.intro p{font-size:15px;margin-bottom:18px}.inc{display:none}.card{padding:18px 18px}.names{margin-top:10px}.names .to{font-size:28px}main{gap:18px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card.bump::after{transition:none}.spin{animation:none}}

  $("cTo").textContent = val("to_name") || t("toPh"); $("cTo").style.opacity = val("to_name") ? 1 : .35;
  $("cFrom").textContent = val("from_name") || t("fromPh"); $("cFrom").style.opacity = val("from_name") ? 1 : .45;
  $("cProgs").textContent = t("progs").replace("{n}", G.addon ? 3 : 2);
  const m = $("cMsg"), occ = G.occasion ? T[lang].occ[G.occasion] : "", txt = val("message");
  m.hidden = !occ && !txt; m.textContent = "";
  if (occ) { const b = document.createElement("b"); b.textContent = occ; m.append(b); }
  if (txt) m.append(document.createTextNode(txt));
  $("count").textContent = $("message").value.length + "/300";
}
function bump() { const c = $("card"); c.classList.add("bump"); clearTimeout(bump.t); bump.t = setTimeout(() => c.classList.remove("bump"), 260); }
function paint() {
  document.documentElement.lang = lang;
  document.title = lang === "es" ? "Gift card · PupFlow" : "Gift card · PupFlow";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  $("to_name").placeholder = "María";
  $("to_email").placeholder = "maria@email.com";
  $("from_name").placeholder = "Alejandro";
  $("message").placeholder = lang === "es" ? "Para que Toby y tú tengan los mejores paseos." : "For you and Toby, to many calm walks together.";
  const ch = $("chips"); ch.textContent = "";
  OCC.forEach(o => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = T[lang].occ[o];
    b.setAttribute("aria-pressed", String(G.occasion === o)); b.onclick = () => { G.occasion = G.occasion === o ? "" : o; paint(); bump(); }; ch.append(b); });
  document.querySelectorAll("#pl button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.pl === G.plan_lang)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  $("addon").setAttribute("aria-checked", String(G.addon));
  $("addPr").textContent = "+" + usd(addonPrice);
  const promo = Number(listPrice) > Number(price);
  $("promo").hidden = !promo; $("promo").textContent = t("promo");
  $("sPlan").innerHTML = (promo ? "<s>" + usd(listPrice) + "</s>" : "") + usd(price);
  $("sAddRow").hidden = !G.addon; $("sAdd").textContent = usd(addonPrice);
  $("sTot").textContent = usd(total());
  $("test").textContent = t("test");
  $("home").href = "index.html?lang=" + lang;
  document.querySelectorAll('a[href^="index.html#refund"]').forEach(a => a.href = "index.html?lang=" + lang + "#refund");
  card();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("pf-lang", lang); } catch (e) {} paint(); });
document.querySelectorAll("#pl button").forEach(b => b.onclick = () => { G.plan_lang = b.dataset.pl; paint(); });
$("addon").onclick = () => { G.addon = !G.addon; paint(); bump(); };
["to_name", "from_name", "message", "to_email"].forEach(id => $(id).addEventListener("input", () => { $(id).classList.remove("bad"); card(); }));
paint();

function check() {
  const bad = [];
  if (!val("from_name")) bad.push("from_name");
  if (!val("to_name")) bad.push("to_name");
  if (!EMAIL.test(val("to_email"))) bad.push("to_email");
  ["to_name", "to_email", "from_name"].forEach(id => $(id).classList.toggle("bad", bad.includes(id)));
  if (bad.length) { say("err", t("need")); $(bad[0]).focus(); return false; }
  $("msg").className = "msgbox"; return true;
}
async function post(fn, body) {
  const r = await fetch("/.netlify/functions/" + fn, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({})); d._status = r.status; return d;
}
function done(d) {
  const n = val("to_name"), e = val("to_email");
  const p = $("panel"); p.textContent = "";
  const box = document.createElement("div"); box.className = "done"; box.setAttribute("role", "status");
  const big = document.createElement("div"); big.className = "big"; big.textContent = "🎁";
  const h = document.createElement("h2"); h.textContent = t("doneT");
  const p1 = document.createElement("p"); p1.textContent = t("doneL").replace("{name}", n).replace("{email}", e);
  const p2 = document.createElement("p"); p2.textContent = t("doneSpam").replace("{name}", n);
  const a1 = document.createElement("a"); a1.href = "gift.html?lang=" + lang; a1.textContent = t("again");
  const a2 = document.createElement("a"); a2.href = "index.html?lang=" + lang; a2.textContent = t("back");
  box.append(big, h, p1, p2, a1, a2); p.append(box);
  scrollTo({ top: 0, behavior: "smooth" });
}
function loadSdk(clientId) {
  return new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(clientId) + "&currency=USD&intent=capture&locale=" + (lang === "es" ? "es_US" : "en_US");
    s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  });
}
(async () => {
  let cfg = {};
  try { cfg = await (await fetch("/.netlify/functions/config")).json(); } catch (e) {}
  if (cfg.price) price = cfg.price; if (cfg.listPrice) listPrice = cfg.listPrice; if (cfg.addonPrice) addonPrice = cfg.addonPrice;
  paint();
  if (cfg.env !== "live") $("test").classList.add("on");
  if (!cfg.clientId) { $("pp").textContent = ""; say("err", t("off")); return; }
  try { await loadSdk(cfg.clientId); } catch (e) { $("pp").textContent = ""; say("err", t("off")); return; }
  $("pp").textContent = "";
  paypal.Buttons({
    style: { layout: "vertical", shape: "pill", label: "pay" },
    onClick: (data, actions) => {
      if (!check()) return actions.reject();
      try { fbq("track", "InitiateCheckout", { value: Number(total()), currency: "USD", content_name: "PupFlow gift card" }); } catch (e) {}
      return actions.resolve();
    },
    createOrder: async () => {
      const d = await post("create-gift", { to_name: val("to_name"), to_email: val("to_email"), from_name: val("from_name"), message: val("message"),
        occasion: G.occasion, plan_lang: G.plan_lang, page_lang: lang, addon: G.addon });
      if (!d.id) { say("err", d.error === "bad_gift" ? t("need") : t("fail")); throw new Error("create"); }
      return d.id;
    },
    onApprove: async data => {
      say("ok", t("wait"));
      let d; try { d = await post("capture-gift", { orderID: data.orderID }); } catch (e) { d = { error: "network" }; }
      if (!d.ok) { say("err", t("notPaid") + " (" + [d._status, d.error, d.capture].filter(Boolean).join(" · ") + ")"); return; }
      try { fbq("track", "Purchase", { value: Number(d.value) || Number(total()), currency: "USD", content_name: "PupFlow gift card", content_type: "product" }, { eventID: d.order }); } catch (e) {}
      done(d);
    },
    onError: () => say("err", t("fail"))
  }).render("#pp");
})();
</script>
</body>
</html>
