<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkout · PupFlow</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--teal:#1F6F78;--deep:#154E55;--orange:#F28C38;--cream:#FFF6EC;--mint:#EEF6F6;--ink:#22313F;--soft:#5b6b78;--line:#e3ecee}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:1040px;margin:0 auto}
.top img{height:34px}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--mint);border:1px solid var(--line);gap:2px}
.lang button{border:0;background:transparent;font:800 13px/1 inherit;color:var(--soft);min-width:40px;min-height:32px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:#fff}
.test{display:none;background:#FFE7CF;color:#7a3f00;text-align:center;font-size:14px;font-weight:700;padding:8px 16px}
.test.on{display:block}
.chg{background:none;border:0;padding:0 0 0 6px;font:inherit;font-size:13px;color:var(--deep);text-decoration:underline;cursor:pointer;opacity:.75}
.lead{color:var(--soft);margin:0 0 18px}
.pp-box{min-height:120px}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
.msg.on{display:block}.msg.err{background:#fde8e8;color:#8a1c1c}.msg.ok{background:#e6f6ec;color:#1d5b33}
.promo{display:inline-block;background:#F28C38;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;margin-bottom:8px}.promo[hidden]{display:none}
.safe{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--soft);font-size:14px;margin-top:12px}
.rf{color:var(--soft);font-size:13px;text-align:center;margin:10px 0 0}
.rf a,.back{color:var(--teal)}
.back{display:inline-block;margin-top:14px;font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--mint);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
main{max-width:620px;margin:0 auto;padding:6px 16px 56px;display:grid;gap:16px}
h1{font-size:clamp(24px,4vw,32px);line-height:1.15;margin:4px 0 12px;color:var(--deep)}
.card{border:1px solid var(--line);border-radius:20px;padding:16px;background:#fff;box-shadow:0 24px 50px -40px rgba(21,78,85,.5)}
.sum{background:var(--cream);border-color:#f6e2cc;display:flex;gap:14px;align-items:center}
.thumb{width:72px;height:auto;border-radius:8px;flex:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);transform:rotate(-3deg)}
.sumtxt{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-weight:700}
.row.small{font-weight:500;font-size:14px;color:var(--soft)}
.row.tot{border-top:1px dashed #ecd6bd;margin-top:4px;padding-top:8px;font-size:18px;font-weight:800}
.paycard{border:2px solid var(--teal)}
.guar{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:14px;background:#FFF3E6;border:1.5px dashed #F2B47F}
.guar .seal{flex:none;width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:800 18px/1 system-ui}
.guar b{display:block;font-size:15px}.guar span{font-size:14px;color:var(--soft)}
.after h2{font-size:17px;margin:6px 0 4px;color:var(--deep)}
.after ol{padding-left:20px;margin:0;color:var(--ink);font-size:15px}.after li{margin:4px 0}
@media(min-width:860px){main{padding-top:28px}}
</style>
<!-- Meta Pixel -->
<script>
/* Team test visits: open any page once with ?test=1 (undo with ?test=0) so Meta and Clarity ignore this browser. */
(function(){try{var q=location.search;if(/[?&]test=1/.test(q))localStorage.setItem('pf-test','1');if(/[?&]test=0/.test(q))localStorage.removeItem('pf-test');window.PF_TEST=localStorage.getItem('pf-test')==='1';}catch(e){}})();
if(window.PF_TEST){window.fbq=function(){};}else{
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1867773444384467');fbq('track','PageView');
}
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1867773444384467&ev=PageView&noscript=1"></noscript>
<!-- End Meta Pixel -->
<!-- Microsoft Clarity (session recordings / heatmaps; inputs are masked) -->
<script type="text/javascript">
if(window.PF_TEST){window.clarity=function(){};}else{(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script","z3uk80q9ws");}
</script>

</head>
<body>
<div class="test" id="test"></div>
<div class="top"><a href="index.html" id="home"><img src="logo.png" alt="PupFlow"></a>
  <div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div></div>
<main>
  <section class="head">
    <h1 data-t="h1"></h1>
    <div class="card sum">
      <img class="thumb" src="img/cover-chicha-en.webp" alt="" width="620" height="802">
      <div class="sumtxt">
        <div class="promo" id="promo" hidden></div>
        <div class="row"><span data-t="item"></span><span id="price1"></span></div>
        <div class="row small"><span data-t="planlang"></span><span><span id="pl"></span> <button type="button" class="chg" id="plChg"></button></span></div>
        <div class="row tot"><span data-t="total"></span><span id="price2"></span></div>
      </div>
    </div>
  </section>
  <section class="card paycard">
    <div class="pp-box" id="pp"><div class="spin"></div></div>
    <div class="msg" id="msg"></div>
    <div class="guar"><span class="seal">14</span><div><b data-t="g1"></b><span data-t="g2"></span></div></div>
    <div class="safe"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg><span data-t="safe"></span></div>
  </section>
  <section class="after">
    <h2 data-t="next"></h2>
    <ol><li data-t="b1"></li><li data-t="b2"></li><li data-t="b3"></li></ol>
    <p class="rf"><span data-t="rf"></span> <a href="index.html#refund" data-t="rfa"></a>.</p>
    <a class="back" href="index.html" id="back" data-t="back"></a>
  </section>
</main>
<script>
const T = {
  en: { h1: "Your dog's plan is one step away", next: "What happens next", g1: "14-day money-back guarantee", g2: "Not useful for your dog? Email us and we refund you in full.",
        item: "PupFlow 90-day plan", promo: "🚀 Launch price", planlang: "Plan language", chg: { en: "Plan in Spanish?", es: "Plan in English?" }, total: "Total", langName: { en: "English", es: "Spanish" },
        b1: "Pay once with PayPal or card. No subscription.", b2: "Answer 15 quick questions about your dog (5 minutes).", b3: "Your personalized PDF arrives by email: feeding, daily routine and 2 training programs.",
        pay: "Choose how to pay", safe: "Secure payment processed by PayPal. We never see your card details.",
        rf: "14-day money-back guarantee. Details in our", rfa: "Refund Policy", back: "← Back to PupFlow",
        test: "TEST MODE · Payments here are not real", wait: "Confirming your payment…",
        off: "Checkout is being set up. Please try again soon.", fail: "We couldn't complete the payment. You were not charged. Please try again.",
        notPaid: "PayPal didn't confirm the payment. If you were charged, write to us and we'll fix it right away.", ok: "Payment confirmed! Taking you to the form…" },
  es: { h1: "El plan de tu perro está a un paso", next: "Qué pasa después", g1: "Garantía de 14 días", g2: "¿No le sirve a tu perro? Escríbenos y te devolvemos todo.",
        item: "Plan PupFlow de 90 días", promo: "🚀 Promo de lanzamiento", planlang: "Idioma del plan", chg: { en: "¿Plan en español?", es: "¿Plan en inglés?" }, total: "Total", langName: { en: "Inglés", es: "Español" },
        b1: "Pagas una sola vez con PayPal o tarjeta. Sin suscripción.", b2: "Respondes 15 preguntas rápidas sobre tu perro (5 minutos).", b3: "Tu PDF personalizado llega por email: alimentación, rutina diaria y 2 programas de entrenamiento.",
        pay: "Elige cómo pagar", safe: "Pago seguro procesado por PayPal. Nunca vemos los datos de tu tarjeta.",
        rf: "Garantía de 14 días. Detalles en nuestra", rfa: "Política de reembolso", back: "← Volver a PupFlow",
        test: "MODO PRUEBA · Los pagos acá no son reales", wait: "Confirmando tu pago…",
        off: "Estamos terminando de configurar el pago. Vuelve a intentarlo pronto.", fail: "No pudimos completar el pago. No se te cobró nada. Inténtalo de nuevo.",
        notPaid: "PayPal no confirmó el pago. Si se te cobró, escríbenos y lo resolvemos enseguida.", ok: "¡Pago confirmado! Te llevamos al formulario…" }
};
const q = new URLSearchParams(location.search);
let lang = q.get("lang") === "es" || q.get("lang") === "en" ? q.get("lang") : (/^es\b/i.test(navigator.language || "") ? "es" : "en");
let planLang = q.get("plan_lang") === "es" ? "es" : (q.get("plan_lang") === "en" ? "en" : lang);
let price = "19.00", listPrice = "29.00";
const $ = id => document.getElementById(id);
function msg(kind, text) { const m = $("msg"); m.className = "msg on " + kind; m.textContent = text; }
function paint() {
  const t = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  $("pl").textContent = t.langName[planLang];
  $("plChg").textContent = t.chg[planLang];
  const fmt = v => "US$" + v.replace(/\.00$/, "");
  const promo = parseFloat(listPrice) > parseFloat(price);
  $("price1").innerHTML = (promo ? `<s style="opacity:.6;margin-right:6px">${fmt(listPrice)}</s>` : "") + fmt(price);
  $("price2").textContent = fmt(price);
  $("promo").hidden = !promo; $("promo").textContent = t.promo;
  $("test").textContent = t.test;
  document.querySelector(".thumb").src = "img/cover-chicha-" + lang + ".webp";
  $("home").href = $("back").href = "index.html?lang=" + lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("pf-lang", lang); } catch (e) {} paint(); });
$("plChg").onclick = () => {
  planLang = planLang === "es" ? "en" : "es";
  try { localStorage.setItem("pf-plan-lang", planLang); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set("plan_lang", planLang); history.replaceState(null, "", u);
  try { fbq("trackCustom", "PlanLangChange", { plan_lang: planLang }); } catch (e) {}
  paint();
};
paint();

async function post(fn, body) {
  const r = await fetch("/.netlify/functions/" + fn, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({})); d._status = r.status; return d;
}
function loadSdk(clientId) {
  return new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://www.paypal.com/sdk/js?client-id=" + encodeURIComponent(clientId) + "&currency=USD&intent=capture&locale=" + (lang === "es" ? "es_US" : "en_US");
    s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  });
}
(async () => {
  let cfg = {};
  try { fbq("track", "InitiateCheckout", { currency: "USD", content_name: "PupFlow 90-day plan" }); } catch (e) {}
  try { cfg = await (await fetch("/.netlify/functions/config")).json(); } catch (e) {}
  if (cfg.price) { price = cfg.price; if (cfg.listPrice) listPrice = cfg.listPrice; paint(); }
  if (cfg.env !== "live") $("test").classList.add("on");
  if (!cfg.clientId) { $("pp").textContent = ""; msg("err", T[lang].off); return; }
  try { await loadSdk(cfg.clientId); } catch (e) { $("pp").textContent = ""; msg("err", T[lang].off); return; }
  $("pp").textContent = "";
  paypal.Buttons({
    style: { layout: "vertical", shape: "pill", label: "pay" },
    onClick: d => { try { fbq("trackCustom", "PayClick", { method: (d && d.fundingSource) || "paypal" }); } catch (e) {} try { clarity("event", "pay_click"); } catch (e) {} },
    onCancel: () => { try { fbq("trackCustom", "PayCancel"); } catch (e) {} },
    createOrder: async () => {
      const d = await post("create-order", { plan_lang: planLang });
      if (!d.id) { msg("err", T[lang].fail); throw new Error("create"); }
      return d.id;
    },
    onApprove: async data => {
      msg("ok", T[lang].wait);
      let d; try { d = await post("capture-order", { orderID: data.orderID }); } catch (e) { d = { error: "network" }; }
      if (!d.ok) {
        const code = [d._status, d.error, d.detail, d.capture, d.reason].filter(Boolean).join(" · ");
        msg("err", T[lang].notPaid + " (" + code + ")"); return;
      }
      const purchase = { order: d.order, token: d.token, plan_lang: d.plan_lang, email: d.email };
      try { localStorage.setItem("pf-purchase", JSON.stringify(purchase)); } catch (e) {}
      msg("ok", T[lang].ok);
      const u = new URLSearchParams({ order: d.order, t: d.token, plan_lang: d.plan_lang, lang });
      try { fbq("track", "Purchase", { value: Number(d.value) || 19, currency: "USD", content_name: "PupFlow 90-day plan", content_type: "product" }, { eventID: d.order }); } catch (e) {}
      setTimeout(() => location.assign("form.html?" + u.toString()), 700);
    },
    onError: () => { try { fbq("trackCustom", "PayError"); } catch (e) {} msg("err", T[lang].fail); }
  }).render("#pp");
})();
</script>
</body>
</html>
